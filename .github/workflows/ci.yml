name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: commerce_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      # Test-only values. Real secrets never appear in CI configuration.
      SECURITY_API_KEY_PEPPER: ci-test-pepper
      REDIS_URL: redis://localhost:6379/1
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/commerce_test
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/commerce_test
      TELEGRAM_BOT_TOKEN: "123456:ci-test-token-not-a-real-token"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Generate an ephemeral encryption key
        run: |
          echo "SECURITY_SECRETS_ENCRYPTION_KEY=$(python -c 'from cryptography.fernet import Fernet;print(Fernet.generate_key().decode())')" >> "$GITHUB_ENV"

      - name: Lint
        run: ruff check app tests scripts

      - name: Verify migrations match the models
        run: |
          alembic upgrade head
          alembic check

      - name: Test (including PostgreSQL concurrency tests)
        run: pytest tests -q --maxfail=1
